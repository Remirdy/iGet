name: iGet
options:
  bundleIdPrefix: com.twobitdev
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '0.3.0'
    CURRENT_PROJECT_VERSION: 3
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: '-Osize'
      SWIFT_COMPILATION_MODE: wholemodule
      DEAD_CODE_STRIPPING: YES
      ENABLE_NS_ASSERTIONS: NO
schemes:
  iGet:
    build:
      targets:
        iGet: all
        iGetWidgets: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  iGet:
    type: application
    platform: macOS
    sources:
      - path: iGet
        excludes: ['*.plist', '*.entitlements']
      - App
      - Packages
      - path: Config/Localization
        buildPhase: resources
      - OverlayEngine
      - path: Config/BrandLogo.png
        buildPhase: resources
      - path: Config/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twobitdev.iGet
        INFOPLIST_FILE: iGet/Info.plist
        CODE_SIGN_ENTITLEMENTS: iGet/iGet.entitlements
    dependencies:
      - target: iGetWidgets
        embed: true
      - sdk: libsqlite3.tbd
      - sdk: IOKit.framework
  iGetWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: iGetWidgets
        excludes: ['*.plist', '*.entitlements']
      - Packages
      - path: Config/Localization
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twobitdev.iGet.widgets
        INFOPLIST_FILE: iGetWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: iGetWidgets/iGetWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) WIDGET_EXTENSION'
        SKIP_INSTALL: YES
    dependencies:
      - sdk: libsqlite3.tbd
