# project.yml — XcodeGen Proje Tanımı
# iGet — Hybrid Desktop Widget Application
#
# Kullanım:
#   brew install xcodegen
#   xcodegen generate   (proje kökünde)
#
# XcodeGen docs: https://github.com/yonaskolb/XcodeGen

name: iGet
options:
  bundleIdPrefix:        com.twobitdev
  deploymentTarget:
    macOS:               "14.0"
  xcodeVersion:          "15.0"
  createIntermediateGroups: true
  defaultConfig:         Debug
  groupSortPosition:     top
  generateEmptyDirectories: true

# ── Ayarlar ──────────────────────────────────────────────────────────────────

settings:
  base:
    SWIFT_VERSION:                     "5.9"
    MACOSX_DEPLOYMENT_TARGET:          "14.0"
    ALWAYS_SEARCH_USER_PATHS:          NO
    CLANG_ENABLE_MODULES:              YES
    ENABLE_HARDENED_RUNTIME:           YES
    CODE_SIGN_STYLE:                   Automatic
    DEVELOPMENT_TEAM:                  ""          # Apple Team ID buraya
    SWIFT_EMIT_LOC_STRINGS:            YES
    MTL_ENABLE_DEBUG_INFO:             INCLUDE_SOURCE
    DEBUG_INFORMATION_FORMAT:          dwarf-with-dsym
    # Swift plugin server'ın sandbox dışında çalışmasına izin ver
    ENABLE_USER_SCRIPT_SANDBOXING:     NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL:        "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS:    DEBUG=1
    Release:
      SWIFT_OPTIMIZATION_LEVEL:        "-O"
      SWIFT_COMPILATION_MODE:          wholemodule
      VALIDATE_PRODUCT:                YES
      ENABLE_NS_ASSERTIONS:            NO

# ── Konfigürasyonlar ──────────────────────────────────────────────────────────

configs:
  Debug:   debug
  Release: release

# ── Şemalar ──────────────────────────────────────────────────────────────────

schemes:
  iGet:
    build:
      targets:
        iGet:         [run, test, profile, analyze, archive]
        iGetWidgets:  [run, test, profile, analyze, archive]
    run:
      config:   Debug
      askForAppToLaunch: false
    test:
      config:   Debug
    profile:
      config:   Release
    analyze:
      config:   Debug
    archive:
      config:   Release

# ── Target'lar ───────────────────────────────────────────────────────────────

targets:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 1. İGet — Ana Uygulama
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  iGet:
    type:     application
    platform: macOS

    bundleIdSuffix:  iGet   # → com.twobitdev.iGet
    productName:     iGet

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER:     com.twobitdev.iGet
        PRODUCT_NAME:                  iGet
        INFOPLIST_FILE:                iGet/Info.plist
        CODE_SIGN_ENTITLEMENTS:        iGet/iGet.entitlements
        ENABLE_HARDENED_RUNTIME:       YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Dock ikonunu gizle (MenuBar uygulaması)
        LSUIElement:                   YES

    sources:
      # Ana uygulama kaynak dosyaları
      - path:   iGet
        excludes:
          - "**/*.entitlements"
          - "**/*.plist"
      - path:   App
      - path:   Packages
      - path:   Features
      - path:   Widgets
      # Shared katman (her iki target için)
      - path:   Shared
      # OverlayEngine
      - path:   OverlayEngine

    dependencies:
      # Widget extension
      - target: iGetWidgets
        embed:  true

    entitlements:
      path: iGet/iGet.entitlements

    info:
      path: iGet/Info.plist

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 2. iGetWidgets — WidgetKit Extension
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  iGetWidgets:
    type:     app-extension
    platform: macOS

    productName: iGetWidgets

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER:     com.twobitdev.iGet.widgets
        PRODUCT_NAME:                  iGetWidgets
        INFOPLIST_FILE:                iGetWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS:        iGetWidgets/iGetWidgets.entitlements
        ENABLE_HARDENED_RUNTIME:       YES
        # App Extension zorunluluğu — WidgetKit extension'lar için YES olmalı
        APPLICATION_EXTENSION_API_ONLY: YES

    sources:
      # Widget kaynak dosyaları
      - path:   iGetWidgets
        excludes:
          - "**/*.entitlements"
          - "**/*.plist"
      - path:   Packages
      - path:   Features
      - path:   Widgets
      # Shared katman
      - path:   Shared

    entitlements:
      path: iGetWidgets/iGetWidgets.entitlements

    info:
      path: iGetWidgets/Info.plist
